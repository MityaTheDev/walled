spring:
  application:
    name: walled
  datasource:
    url: jdbc:postgresql://localhost:5432/walled_db
    username: wall_user
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect